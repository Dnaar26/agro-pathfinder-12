name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  frontend-and-database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start local Supabase
        run: supabase start -x studio,logflare,vector

      - name: Prepare local E2E authentication
        run: |
          supabase_env="$(supabase status -o env)"
          printf '%s\n' "$supabase_env" >> "$GITHUB_ENV"
          api_url="$(printf '%s\n' "$supabase_env" | sed -n 's/^API_URL=//p' | sed 's/^"//; s/"$//')"
          anon_key="$(printf '%s\n' "$supabase_env" | sed -n 's/^ANON_KEY=//p' | sed 's/^"//; s/"$//')"
          service_role_key="$(printf '%s\n' "$supabase_env" | sed -n 's/^SERVICE_ROLE_KEY=//p' | sed 's/^"//; s/"$//')"
          echo "E2E_AUTH_EMAIL=e2e-ci@example.test" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=$api_url" >> "$GITHUB_ENV"
          echo "SUPABASE_PUBLISHABLE_KEY=$anon_key" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$service_role_key" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_URL=$api_url" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$anon_key" >> "$GITHUB_ENV"

      - name: Rebuild local database
        run: supabase db reset

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Build application
        run: npm run build

      - name: Lint application
        run: npm run lint

      - name: Run E2E tests
        run: npm run test:e2e
