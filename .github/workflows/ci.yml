name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  frontend-and-database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck application
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start local Supabase
        run: supabase start -x studio,logflare,vector

      - name: Prepare local E2E authentication
        run: |
          supabase_env="$(supabase status -o env)"
          printf '%s\n' "$supabase_env" >> "$GITHUB_ENV"
          api_url="$(printf '%s\n' "$supabase_env" | sed -n 's/^API_URL=//p' | sed 's/^"//; s/"$//')"
          anon_key="$(printf '%s\n' "$supabase_env" | sed -n 's/^ANON_KEY=//p' | sed 's/^"//; s/"$//')"
          service_role_key="$(printf '%s\n' "$supabase_env" | sed -n 's/^SERVICE_ROLE_KEY=//p' | sed 's/^"//; s/"$//')"
          echo "E2E_AUTH_EMAIL=e2e-ci@example.test" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=$api_url" >> "$GITHUB_ENV"
          echo "SUPABASE_PUBLISHABLE_KEY=$anon_key" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$service_role_key" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_URL=$api_url" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$anon_key" >> "$GITHUB_ENV"

      - name: Rebuild local database
        run: supabase db reset

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Build application
        run: npm run build

      - name: Smoke compiled production server
        env:
          APP_ALLOWED_ORIGINS: http://127.0.0.1:4175
          NODE_ENV: production
          PORT: "4175"
          SMOKE_ALLOW_HTTP: "true"
          SMOKE_BASE_URL: http://127.0.0.1:4175
        run: |
          node scripts/start-server.mjs > /tmp/sigic-production.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$SMOKE_BASE_URL/healthz" >/dev/null; then
              npm run smoke:production
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/sigic-production.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/sigic-production.log
          exit 1

      - name: Lint application
        run: npm run lint

      - name: Run E2E tests
        run: npm run test:e2e
