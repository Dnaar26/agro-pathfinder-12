name: Production smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public HTTPS URL of the production service
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run production smoke checks
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url }}
        run: npm run smoke:production
