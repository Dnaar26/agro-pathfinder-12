name: Production database deployment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to approve production migration
        required: true
        type: string

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: xgacqkakfaormeqaagkc

jobs:
  migrate:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "${{ secrets.SUPABASE_PRODUCTION_DB_PASSWORD }}"

      - name: Apply versioned migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push
