$kind: http-request
name: Get NDVI
order: 1000
method: GET
url: '{{base_url}}/_server/fn/getNdvi'
description: 'Get NDVI (Normalized Difference Vegetation Index) for a parcel. Checks cache first, then queries Sentinel Hub. Requires cookie auth.'
queryParams:
  - key: parcelId
    value: '{{parcel_id}}'
  - key: latitude
    value: '4.7110'
  - key: longitude
    value: '-74.0721'
