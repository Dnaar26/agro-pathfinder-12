$kind: http-request
name: Get My Profile
order: 1000
method: GET
url: '{{supabase_url}}/rest/v1/profiles?select=*&id=eq.{{user_id}}'
description: "Get the current user's profile."
headers:
  - key: apikey
    value: '{{supabase_anon_key}}'
  - key: Authorization
    value: 'Bearer {{access_token}}'
