$kind: http-request
name: List Alerts
order: 6000
method: GET
url: '{{supabase_url}}/rest/v1/alerts?select=*,profiles!user_id(full_name)&order=scheduled_at.desc'
description: List all alerts with user info.
headers:
  - key: apikey
    value: '{{supabase_anon_key}}'
  - key: Authorization
    value: 'Bearer {{access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response is an array", function () {
        const jsonData = pm.response.json();
        pm.expect(jsonData).to.be.an("array");
      });

      pm.test("Each alert has required fields", function () {
        const jsonData = pm.response.json();
        jsonData.forEach(function(alert) {
          pm.expect(alert).to.have.property("id");
          pm.expect(alert).to.have.property("title");
          pm.expect(alert).to.have.property("status");
          pm.expect(["PENDIENTE", "ENVIADA", "CANCELADA"]).to.include(alert.status);
        });
      });
